name: DNS (Cloudflare)

on:
  push:
    branches: [main]
    paths: ["dns/**"]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply changes (otherwise only show the plan)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dns
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 dns/sync.py
      - name: Apply
        if: github.event_name == 'push' || inputs.apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 dns/sync.py --apply
